name: publish

# Trusted publishing: PyPI verifies this workflow through GitHub's OIDC token, so there is no
# API token to store anywhere. The four values on PyPI's pending-publisher form must match
# this file exactly:
#   project name  unitoolkit
#   owner         vhsgreed
#   repository    shh-study-kit
#   workflow      publish.yml          (this file name, not the "name:" above)
#   environment   pypi                 (must equal the environment: below)

on:
  release:
    types: [published]
  workflow_dispatch:                   # a manual run from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip websockets pytest setuptools wheel build
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the metadata
        run: python -m pip install twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi                  # must equal the environment name given to PyPI
    permissions:
      id-token: write                  # the OIDC token PyPI checks
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
